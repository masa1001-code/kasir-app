<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 font-sans">
    
    <!-- HALAMAN LOGIN -->
    <div id="login-page" class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 mt-10">
        <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">Login Kasir</h1>
        <div class="space-y-4">
            <div>
                <label class="block text-sm text-gray-600">Email</label>
                <input type="email" id="email" class="w-full border p-2 rounded mt-1 outline-none focus:border-blue-500" placeholder="kasir@toko.com">
            </div>
            <div>
                <label class="block text-sm text-gray-600">Password</label>
                <input type="password" id="password" class="w-full border p-2 rounded mt-1 outline-none focus:border-blue-500" placeholder="******">
            </div>
            <button onclick="window.login()" class="w-full bg-blue-500 text-white font-bold py-2 px-4 rounded mt-2">Masuk</button>
            <button onclick="window.register()" class="w-full bg-gray-200 text-gray-700 font-bold py-2 px-4 rounded mt-2">Daftar Akun Baru</button>
            <p id="error-msg" class="text-red-500 text-sm text-center mt-2 hidden"></p>
        </div>
    </div>

    <!-- HALAMAN KASIR -->
    <div id="app-page" class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 hidden">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-xl font-bold text-blue-600">Kasir Kita</h1>
            <button onclick="window.logout()" class="text-sm bg-red-500 text-white px-3 py-1 rounded shadow">Logout</button>
        </div>
        
        <p class="text-sm text-gray-500 mb-4 border-b pb-2">Kasir: <span id="user-email" class="font-bold text-gray-700"></span></p>

        <!-- Loading Text -->
        <p id="loading-text" class="text-center text-blue-500 text-sm font-bold mb-4">Memuat data dari database...</p>

        <!-- Daftar Produk -->
        <div id="product-list" class="space-y-4 mb-6 border-b pb-4"></div>

        <!-- Tombol Rahasia Buat Ngisi Database Pertama Kali -->
        <button id="btn-seed" onclick="window.isiDatabaseAwal()" class="w-full bg-purple-500 text-white text-sm py-2 rounded mb-4 hidden">
            ✨ Klik Ini Buat Isi Produk ke Database (Sekali Aja)
        </button>

        <!-- Keranjang -->
        <div>
            <h3 class="font-bold text-gray-700 mb-2">Keranjang:</h3>
            <div id="cart-list" class="text-sm space-y-1 mb-4 text-gray-600 min-h-[40px]"></div>
            
            <div class="mt-4 pt-4 border-t border-gray-200">
                <div class="flex justify-between font-bold text-lg text-gray-800">
                    <span>Total:</span>
                    <span id="total-price">Rp 0</span>
                </div>
                <button onclick="window.bayar()" id="btn-bayar" class="w-full bg-green-500 text-white font-bold py-3 px-4 rounded mt-4">
                    Bayar & Simpan ke DB
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        // Import Auth & Firestore Database
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBb5AhpFs-MFP7Y0gU22C5fq2-J2yGujhs",
            authDomain: "kasir-app-kita-10.firebaseapp.com",
            projectId: "kasir-app-kita-10",
            storageBucket: "kasir-app-kita-10.firebasestorage.app",
            messagingSenderId: "527965857899",
            appId: "1:527965857899:web:07046114891ff249d3e92e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app); // Ini mesin databasenya

        // Variabel Global
        let products = [];
        let cart = [];
        let cartTotal = 0;

        const loginPage = document.getElementById('login-page');
        const appPage = document.getElementById('app-page');
        const errorMsg = document.getElementById('error-msg');
        const btnSeed = document.getElementById('btn-seed');
        const loadingText = document.getElementById('loading-text');

        // --- SISTEM LOGIN ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginPage.classList.add('hidden');
                appPage.classList.remove('hidden');
                document.getElementById('user-email').innerText = user.email;
                window.muatProdukDariDB(); // Tarik data pas login
            } else {
                loginPage.classList.remove('hidden');
                appPage.classList.add('hidden');
            }
        });

        window.login = () => signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value).catch(e => { errorMsg.innerText = "Gagal Login!"; errorMsg.classList.remove('hidden'); });
        window.register = () => createUserWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value).catch(e => { errorMsg.innerText = "Gagal Daftar!"; errorMsg.classList.remove('hidden'); });
        window.logout = () => signOut(auth);

        // --- SISTEM DATABASE KASIR ---
        
        // 1. Fungsi Tarik Data dari Firestore
        window.muatProdukDariDB = async () => {
            loadingText.classList.remove('hidden');
            const querySnapshot = await getDocs(collection(db, "products"));
            products = [];
            
            querySnapshot.forEach((doc) => {
                products.push({ id: doc.id, ...doc.data() }); // Ambil ID asli dari database
            });

            loadingText.classList.add('hidden');

            if(products.length === 0) {
                btnSeed.classList.remove('hidden'); // Munculin tombol injek data kalau kosong
            } else {
                btnSeed.classList.add('hidden');
                tampilkanProduk();
            }
        };

        // 2. Fungsi Injek Data Awal (Sekali pake aja)
        window.isiDatabaseAwal = async () => {
            btnSeed.innerText = "Sedang mengisi database...";
            const dataAwal = [
                { name: 'Kopi Hitam', price: 10000, stock: 50 },
                { name: 'Es Teh Manis', price: 5000, stock: 30 },
                { name: 'Mie Rebus Telur', price: 15000, stock: 20 }
            ];
            
            for (const item of dataAwal) {
                await addDoc(collection(db, "products"), item);
            }
            alert("Berhasil isi database! Halaman akan dimuat ulang.");
            window.muatProdukDariDB(); // Muat ulang tampilannya
        };

        // 3. Render Produk ke Layar
        function tampilkanProduk() {
            const productList = document.getElementById('product-list');
            productList.innerHTML = '';
            products.forEach(product => {
                productList.innerHTML += `
                    <div class="flex justify-between items-center border-b pb-2 mt-3">
                        <div>
                            <h2 class="font-semibold">${product.name}</h2>
                            <p class="text-xs text-gray-500">Sisa: ${product.stock}</p>
                        </div>
                        <div class="text-right">
                            <p class="font-bold">Rp ${product.price.toLocaleString('id-ID')}</p>
                            <button onclick="window.addToCart('${product.id}')" class="bg-blue-500 text-white px-3 py-1 rounded text-sm mt-1">
                                + Keranjang
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        window.addToCart = (productId) => {
            const product = products.find(p => p.id === productId);
            const cartItem = cart.find(item => item.id === productId);
            if (cartItem) cartItem.qty += 1;
            else cart.push({ ...product, qty: 1 });
            renderCart();
        };

        function renderCart() {
            const cartList = document.getElementById('cart-list');
            cartList.innerHTML = '';
            cartTotal = 0;

            if (cart.length === 0) {
                cartList.innerHTML = '<p class="text-gray-400 italic">Keranjang kosong</p>';
            } else {
                cart.forEach(item => {
                    const subtotal = item.price * item.qty;
                    cartTotal += subtotal;
                    cartList.innerHTML += `
                        <div class="flex justify-between border-b border-dashed pb-1">
                            <span>${item.name} <span class="text-blue-500 font-bold">x${item.qty}</span></span>
                            <span>Rp ${subtotal.toLocaleString('id-ID')}</span>
                        </div>
                    `;
                });
            }
            document.getElementById('total-price').innerText = `Rp ${cartTotal.toLocaleString('id-ID')}`;
        }

        // 4. Fungsi Bayar (Simpan ke Riwayat Database)
        window.bayar = async () => {
            if (cart.length === 0) return alert("Keranjang kosong bro!");
            
            const btnBayar = document.getElementById('btn-bayar');
            btnBayar.innerText = "Menyimpan ke Database...";
            btnBayar.disabled = true;

            try {
                // Simpan transaksi ke tabel 'transactions' di database
                await addDoc(collection(db, "transactions"), {
                    kasir: auth.currentUser.email,
                    items: cart,
                    total_harga: cartTotal,
                    tanggal: new Date().toISOString()
                });

                alert("✅ Transaksi Berhasil Disimpan ke Database Cloud!");
                cart = []; // Kosongin keranjang
                renderCart();
            } catch (error) {
                alert("Gagal menyimpan: " + error.message);
            }

            btnBayar.innerText = "Bayar & Simpan ke DB";
            btnBayar.disabled = false;
        };
    </script>
</body>
</html>
