<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir PWA Simple</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h1 class="text-2xl font-bold text-center text-blue-600 mb-4">Kasir Kita</h1>
        
        <div class="space-y-4">
            <!-- Contoh Produk -->
            <div class="flex justify-between items-center border-b pb-2">
                <div>
                    <h2 class="font-semibold">Kopi Hitam</h2>
                    <p class="text-sm text-gray-500">Stok: 50</p>
                </div>
                <div class="text-right">
                    <p class="font-bold">Rp 10.000</p>
                    <button class="bg-blue-500 text-white px-3 py-1 rounded text-sm mt-1">+ Keranjang</button>
                </div>
            </div>
        </div>

        <div class="mt-6 pt-4 border-t border-gray-200">
            <div class="flex justify-between font-bold text-lg">
                <span>Total:</span>
                <span>Rp 0</span>
            </div>
            <button class="w-full bg-green-500 text-white font-bold py-3 px-4 rounded mt-4">
                Bayar Sekarang
            </button>
        </div>
    </div>
</body>
</html>
