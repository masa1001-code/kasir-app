<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir PWA Simple</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h1 class="text-2xl font-bold text-center text-blue-600 mb-4">Kasir Kita</h1>
        
        <!-- Daftar Produk -->
        <div id="product-list" class="space-y-4 mb-6 border-b pb-4">
            <!-- Produk bakal muncul otomatis di sini -->
        </div>

        <!-- Keranjang Belanja -->
        <div>
            <h3 class="font-bold text-gray-700 mb-2">Keranjang:</h3>
            <div id="cart-list" class="text-sm space-y-1 mb-4 text-gray-600 min-h-[40px]">
                <p class="text-gray-400 italic">Keranjang masih kosong</p>
            </div>
            
            <div class="mt-4 pt-4 border-t border-gray-200">
                <div class="flex justify-between font-bold text-lg text-gray-800">
                    <span>Total:</span>
                    <span id="total-price">Rp 0</span>
                </div>
                <button onclick="bayar()" class="w-full bg-green-500 active:bg-green-600 text-white font-bold py-3 px-4 rounded mt-4 transition">
                    Bayar Sekarang
                </button>
            </div>
        </div>
    </div>

    <!-- LOGIKA JAVASCRIPT-NYA -->
    <script>
        // 1. Data Barang Dummy
        const products = [
            { id: 1, name: 'Kopi Hitam', price: 10000, stock: 50 },
            { id: 2, name: 'Es Teh Manis', price: 5000, stock: 30 },
            { id: 3, name: 'Roti Bakar', price: 15000, stock: 20 }
        ];

        let cart = []; // Wadah buat nyimpen belanjaan

        // 2. Fungsi nampilin daftar barang ke layar
        function renderProducts() {
            const productList = document.getElementById('product-list');
            productList.innerHTML = '';
            
            products.forEach(product => {
                productList.innerHTML += `
                    <div class="flex justify-between items-center border-b pb-2 last:border-0 last:pb-0 mt-3">
                        <div>
                            <h2 class="font-semibold text-gray-800">${product.name}</h2>
                            <p class="text-xs text-gray-500">Stok: ${product.stock}</p>
                        </div>
                        <div class="text-right">
                            <p class="font-bold text-gray-800">Rp ${product.price.toLocaleString('id-ID')}</p>
                            <button onclick="addToCart(${product.id})" class="bg-blue-500 active:bg-blue-600 text-white px-3 py-1 rounded text-sm mt-1 transition">
                                + Keranjang
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        // 3. Fungsi pas tombol "+ Keranjang" dipencet
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const cartItem = cart.find(item => item.id === productId);

            if (cartItem) {
                cartItem.qty += 1; // Kalo barang udah ada, tambahin jumlahnya aja
            } else {
                cart.push({ ...product, qty: 1 }); // Kalo belum ada, masukin ke keranjang
            }
            renderCart(); // Perbarui tampilan keranjang
        }

        // 4. Fungsi nampilin keranjang & ngitung total duit
        function renderCart() {
            const cartList = document.getElementById('cart-list');
            const totalPriceEl = document.getElementById('total-price');
            
            cartList.innerHTML = '';
            let total = 0;

            if (cart.length === 0) {
                cartList.innerHTML = '<p class="text-gray-400 italic">Keranjang masih kosong</p>';
            } else {
                cart.forEach((item, index) => {
                    const subtotal = item.price * item.qty;
                    total += subtotal;
                    cartList.innerHTML += `
                        <div class="flex justify-between border-b border-dashed pb-1">
                            <span>${item.name} <span class="text-blue-500 font-bold">x${item.qty}</span></span>
                            <span>Rp ${subtotal.toLocaleString('id-ID')}</span>
                        </div>
                    `;
                });
            }

            totalPriceEl.innerText = `Rp ${total.toLocaleString('id-ID')}`;
        }

        // 5. Fungsi tombol bayar
        function bayar() {
            if (cart.length === 0) {
                alert("Belanja dulu bos, keranjang masih kosong! 😅");
                return;
            }
            alert("✅ Transaksi Berhasil! Total kembalian atau struk disiapkan...");
            cart = []; // Kosongin keranjang lagi setelah bayar
            renderCart();
        }

        // Jalanin fungsi nampilin produk pertama kali web dibuka
        renderProducts();
    </script>
</body>
</html>
