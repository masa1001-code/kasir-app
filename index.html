<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 font-sans">
    
    <!-- HALAMAN LOGIN -->
    <div id="login-page" class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 mt-10">
        <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">Login Kasir</h1>
        <div class="space-y-4">
            <div>
                <label class="block text-sm text-gray-600">Email</label>
                <input type="email" id="email" class="w-full border p-2 rounded mt-1 outline-none focus:border-blue-500" placeholder="kasir@toko.com">
            </div>
            <div>
                <label class="block text-sm text-gray-600">Password</label>
                <input type="password" id="password" class="w-full border p-2 rounded mt-1 outline-none focus:border-blue-500" placeholder="******">
            </div>
            <button onclick="window.login()" class="w-full bg-blue-500 active:bg-blue-600 text-white font-bold py-2 px-4 rounded mt-2 transition">Masuk</button>
            <button onclick="window.register()" class="w-full bg-gray-200 active:bg-gray-300 text-gray-700 font-bold py-2 px-4 rounded mt-2 transition">Daftar Akun Baru</button>
            <p id="error-msg" class="text-red-500 text-sm text-center mt-2 hidden"></p>
        </div>
    </div>

    <!-- HALAMAN KASIR (Disembunyikan dulu kalau belum login) -->
    <div id="app-page" class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 hidden">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-xl font-bold text-blue-600">Kasir Kita</h1>
            <button onclick="window.logout()" class="text-sm bg-red-500 text-white px-3 py-1 rounded shadow">Logout</button>
        </div>
        
        <p class="text-sm text-gray-500 mb-4 border-b pb-2">Kasir: <span id="user-email" class="font-bold text-gray-700"></span></p>

        <!-- Daftar Produk -->
        <div id="product-list" class="space-y-4 mb-6 border-b pb-4"></div>

        <!-- Keranjang -->
        <div>
            <h3 class="font-bold text-gray-700 mb-2">Keranjang:</h3>
            <div id="cart-list" class="text-sm space-y-1 mb-4 text-gray-600 min-h-[40px]"></div>
            
            <div class="mt-4 pt-4 border-t border-gray-200">
                <div class="flex justify-between font-bold text-lg text-gray-800">
                    <span>Total:</span>
                    <span id="total-price">Rp 0</span>
                </div>
                <button onclick="window.bayar()" class="w-full bg-green-500 text-white font-bold py-3 px-4 rounded mt-4">
                    Bayar Sekarang
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT FIREBASE & LOGIKA APLIKASI -->
    <script type="module">
        // Import Firebase dari Google langsung (Nggak perlu install apa-apa)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";

        // Config punya lu blay
        const firebaseConfig = {
            apiKey: "AIzaSyBb5AhpFs-MFP7Y0gU22C5fq2-J2yGujhs",
            authDomain: "kasir-app-kita-10.firebaseapp.com",
            projectId: "kasir-app-kita-10",
            storageBucket: "kasir-app-kita-10.firebasestorage.app",
            messagingSenderId: "527965857899",
            appId: "1:527965857899:web:07046114891ff249d3e92e"
        };

        // Nyalain mesin Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Ambil elemen HTML
        const loginPage = document.getElementById('login-page');
        const appPage = document.getElementById('app-page');
        const errorMsg = document.getElementById('error-msg');
        const userEmailEl = document.getElementById('user-email');
        const emailInput = document.getElementById('email');
        const passInput = document.getElementById('password');

        // --- SISTEM LOGIN/REGISTER ---

        // Ngecek otomatis kalau user berhasil login atau udah login sebelumnya
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Tembus! Tampilkan halaman kasir
                loginPage.classList.add('hidden');
                appPage.classList.remove('hidden');
                userEmailEl.innerText = user.email; // Tulis email kasir di atas
                window.renderProducts(); // Panggil daftar barang
            } else {
                // Belum login! Balik ke halaman login
                loginPage.classList.remove('hidden');
                appPage.classList.add('hidden');
            }
        });

        // Tombol Daftar
        window.register = () => {
            createUserWithEmailAndPassword(auth, emailInput.value, passInput.value)
                .then(() => { errorMsg.classList.add('hidden'); })
                .catch((error) => {
                    errorMsg.innerText = "Gagal: " + error.message;
                    errorMsg.classList.remove('hidden');
                });
        };

        // Tombol Masuk
        window.login = () => {
            signInWithEmailAndPassword(auth, emailInput.value, passInput.value)
                .then(() => { errorMsg.classList.add('hidden'); })
                .catch((error) => {
                    errorMsg.innerText = "Gagal: Email atau Password salah!";
                    errorMsg.classList.remove('hidden');
                });
        };

        // Tombol Logout
        window.logout = () => {
            signOut(auth);
        };


        // --- SISTEM KASIR ---
        const products = [
            { id: 1, name: 'Kopi Hitam', price: 10000, stock: 50 },
            { id: 2, name: 'Es Teh Manis', price: 5000, stock: 30 },
            { id: 3, name: 'Roti Bakar', price: 15000, stock: 20 }
        ];
        let cart = [];

        window.renderProducts = () => {
            const productList = document.getElementById('product-list');
            productList.innerHTML = '';
            products.forEach(product => {
                productList.innerHTML += `
                    <div class="flex justify-between items-center border-b pb-2 mt-3">
                        <div>
                            <h2 class="font-semibold">${product.name}</h2>
                            <p class="text-xs text-gray-500">Stok: ${product.stock}</p>
                        </div>
                        <div class="text-right">
                            <p class="font-bold">Rp ${product.price.toLocaleString('id-ID')}</p>
                            <button onclick="window.addToCart(${product.id})" class="bg-blue-500 text-white px-3 py-1 rounded text-sm mt-1">
                                + Keranjang
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        window.addToCart = (productId) => {
            const product = products.find(p => p.id === productId);
            const cartItem = cart.find(item => item.id === productId);
            if (cartItem) cartItem.qty += 1;
            else cart.push({ ...product, qty: 1 });
            window.renderCart();
        };

        window.renderCart = () => {
            const cartList = document.getElementById('cart-list');
            const totalPriceEl = document.getElementById('total-price');
            cartList.innerHTML = '';
            let total = 0;

            if (cart.length === 0) {
                cartList.innerHTML = '<p class="text-gray-400 italic">Keranjang masih kosong</p>';
            } else {
                cart.forEach(item => {
                    const subtotal = item.price * item.qty;
                    total += subtotal;
                    cartList.innerHTML += `
                        <div class="flex justify-between border-b border-dashed pb-1">
                            <span>${item.name} <span class="text-blue-500 font-bold">x${item.qty}</span></span>
                            <span>Rp ${subtotal.toLocaleString('id-ID')}</span>
                        </div>
                    `;
                });
            }
            totalPriceEl.innerText = `Rp ${total.toLocaleString('id-ID')}`;
        };

        window.bayar = () => {
            if (cart.length === 0) return alert("Keranjang masih kosong!");
            
            // Pas bayar, dia juga bakal catet siapa yang lagi login
            const kasirAktif = auth.currentUser.email;
            alert("Transaksi Berhasil!\nKasir: " + kasirAktif);
            
            cart = [];
            window.renderCart();
        };
    </script>
</body>
</html>
